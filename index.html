<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوة زفاف سيف وإسراء</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-1: #BF953F;
            --gold-2: #FCF6BA;
            --gold-3: #B38728;
            --gold-4: #FBF5B7;
            --gold-5: #AA771C;
            --card-bg: rgba(10, 15, 30, 0.5); /* أغمق قليلاً لزيادة تباين الذهب */
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f6f5f3;
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23e8e5e1" fill-opacity="0.4" fill-rule="evenodd"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z"/%3E%3C/g%3E%3C/svg%3E');
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            color: var(--text-main);
            position: relative;
        }

        /* Removed dark particles */

        .invitation-card {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: transparent;
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .invitation-card.show {
            opacity: 1;
        }

        .card-content {
            width: 100%;
            padding: 3vh 20px 8vh 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5vh;
            z-index: 2;
            position: relative;
            color: #1a1a1a;
        }
        .card-content::-webkit-scrollbar {
            display: none;
        }

        /* Staggered Content Animation */
        .card-content > * {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .invitation-card.show .card-content > * {
            opacity: 1;
            transform: translateY(0);
        }

        .invitation-card.show .card-content > *:nth-child(1) { transition-delay: 0.2s; }
        .invitation-card.show .card-content > *:nth-child(2) { transition-delay: 0.4s; }
        .invitation-card.show .card-content > *:nth-child(3) { transition-delay: 0.6s; }
        .invitation-card.show .card-content > *:nth-child(4) { transition-delay: 0.8s; }
        .invitation-card.show .card-content > *:nth-child(5) { transition-delay: 1.0s; }
        .invitation-card.show .card-content > *:nth-child(6) { transition-delay: 1.2s; }
        .invitation-card.show .card-content > *:nth-child(7) { transition-delay: 1.4s; }
        .invitation-card.show .card-content > *:nth-child(8) { transition-delay: 1.6s; }
        .invitation-card.show .card-content > *:nth-child(9) { transition-delay: 1.8s; }
        .invitation-card.show .card-content > *:nth-child(10) { transition-delay: 2.0s; }
        .invitation-card.show .card-content > *:nth-child(11) { transition-delay: 2.2s; }

        /* Envelope Loading Screen */
        .envelope-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f6f5f3;
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="%23e8e5e1" fill-opacity="0.4" fill-rule="evenodd"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z"/%3E%3C/g%3E%3C/svg%3E');
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        .envelope-wrapper {
            position: relative;
            width: min(85vw, 350px);
            height: min(55vw, 220px);
            background: #d8cebf;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .envelope-wrapper:hover {
            transform: scale(1.02);
        }

        .envelope-wrapper::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            border-style: solid;
            border-width: min(28vw, 110px) min(42.5vw, 175px);
            border-color: transparent transparent #e8e1d5 transparent;
            z-index: 2;
        }

        .envelope-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-style: solid;
            border-width: min(28vw, 110px) min(42.5vw, 175px);
            border-color: transparent #e1d8cb transparent #e1d8cb;
            z-index: 1;
        }

        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: min(32vw, 130px) min(42.5vw, 175px);
            border-color: #eee4d8 transparent transparent transparent;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.08));
        }

        .envelope-seal {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            background: #1a1a1a;
            border-radius: 50%;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: opacity 0.4s;
            border: 2px solid #333;
        }

        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-wrapper.open .envelope-seal {
            opacity: 0;
        }

        .envelope-text {
            margin-top: 50px;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            color: #666;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .card-content {

        .rings-icon {
            font-size: min(10vw, 40px);
            background: linear-gradient(to right, var(--gold-1), var(--gold-2), var(--gold-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(252, 246, 186, 0.5));
            animation: floatRings 3s ease-in-out infinite alternate;
        }

        @keyframes floatRings {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: min(15vw, 65px);
            font-weight: 400;
            line-height: 1.2;
            color: #1a1a1a;
            margin: 0;
            padding-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .wedding-text {
            font-family: 'Amiri', serif;
            font-size: min(6vw, 24px);
            color: #333;
            margin: 0;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .date {
            font-family: 'Cairo', sans-serif;
            font-size: min(5vw, 22px);
            font-weight: 700;
            color: #1a1a1a;
            padding: 5px 0;
            margin: 0;
        }

        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-size: min(4vw, 16px);
            font-weight: 700;
            color: #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 2vh;
        }
        
        .time-badge i {
            color: #d4af37;
            font-size: 18px;
        }

        /* Countdown */
        #countdown {
            display: flex;
            justify-content: center;
            gap: min(2vw, 8px);
            direction: ltr;
            width: 90%;
            background: #fff;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 15px 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            position: relative;
        }

        #countdown::before, #countdown::after {
            display: none; /* Removed double border for cleaner look */
        }

        .time-box {
            flex: 1;
            max-width: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .time-val {
            font-weight: 700;
            color: #1a1a1a;
            font-size: min(8vw, 32px);
            line-height: 1.2;
            font-family: 'Georgia', serif;
        }

        .time-label {
            font-size: min(3vw, 11px);
            color: #666;
            margin-top: 2px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            padding: 0 5px;
            margin-top: auto; 
            margin-bottom: 2vh;
        }

        .action-btn {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #fff;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            width: 100%;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
        }

        .action-btn i.main-icon {
            font-size: min(5vw, 22px);
            color: #d4af37;
            transition: transform 0.3s;
        }

        .action-btn:hover i.main-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: right;
        }

        .action-btn span.title {
            font-size: min(3.5vw, 15px);
            font-weight: 700;
            line-height: 1.2;
        }

        .action-btn span.sub-text {
            font-size: min(2.5vw, 12px);
            color: #888;
            margin-top: 4px;
        }

        /* Music Player specific */
        .music-player.playing {
            background: #fff8f0;
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .music-player.playing i.main-icon {
            animation: pulse-music 1s infinite alternate;
        }

        @keyframes pulse-music {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); color: #b8860b; }
        }

        /* Section Title Decoration */
        .section-title {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: min(5.5vw, 22px);
            color: #1a1a1a;
            margin: 2vh 0 1vh;
            font-weight: bold;
        }

        .floral-divider {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin: 0.5vh 0;
            opacity: 0.8;
        }

        /* Elegant SVG Corners */
        .corner-svg {
            position: absolute;
            width: min(20vw, 80px);
            height: auto;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0; 
        }
        .top-left { top: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; transform: rotate(180deg); }

    </style>
</head>
<body>

    <!-- Envelope Screen -->
    <div class="envelope-screen" id="envelopeScreen">
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope-flap">
                <div class="envelope-seal">افتح<br>الدعوة</div>
            </div>
        </div>
        <div class="envelope-text">اضغط لفتح الدعوة</div>
    </div>

    <div class="invitation-card" id="invitationCard">
        <div class="card-content">
            <!-- Replace rings icon with a small floral header -->
            <div>
                <svg class="floral-divider" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 20C80 20 60 5 40 5C20 5 0 20 0 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M100 20C120 20 140 5 160 5C180 5 200 20 200 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="100" cy="20" r="3" fill="#d4af37"/>
                    <circle cx="40" cy="5" r="2" fill="#d4af37"/>
                    <circle cx="160" cy="5" r="2" fill="#d4af37"/>
                    <path d="M100 20C100 20 90 35 100 35C110 35 100 20 100 20Z" fill="#d4af37" opacity="0.5"/>
                </svg>
                
                <div style="margin: 20px 0;">
                    <img src="couple.png" alt="العريس والعروسة" style="width: 100%; max-width: 250px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                </div>

                <h1 class="names">Seif & Esraa</h1>
            </div>

            <p class="wedding-text">بيتشرفوا بدعوتكم<br>لحضور حفل زفافهم</p>
            
            <div class="date">يوم الجمعة 17 يوليو 2026</div>
            <div class="time-badge">
                <i class="fa-regular fa-clock"></i>
                تبدأ المراسم الساعة 7 مساءً
            </div>

            <div class="section-title">Counting Down to Our Day</div>
            <svg class="floral-divider" viewBox="0 0 200 40" style="margin-top:-10px; margin-bottom:5px;" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 20C80 20 60 35 40 35C20 35 0 20 0 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M100 20C120 20 140 35 160 35C180 35 200 20 200 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="100" cy="20" r="3" fill="#d4af37"/>
            </svg>

            <div id="countdown">
                <div class="time-box">
                    <span id="days" class="time-val">00</span>
                    <span class="time-label">يوم</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="time-val">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span id="mins" class="time-val">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span id="secs" class="time-val">00</span>
                    <span class="time-label">ثانية</span>
                </div>
            </div>
            
            <div class="section-title">Getting There</div>
            <svg class="floral-divider" viewBox="0 0 200 40" style="margin-top:-10px; margin-bottom:10px;" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 20C80 20 60 5 40 5C20 5 0 20 0 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M100 20C120 20 140 5 160 5C180 5 200 20 200 20" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="100" cy="20" r="3" fill="#d4af37"/>
                <circle cx="40" cy="5" r="2" fill="#d4af37"/>
                <circle cx="160" cy="5" r="2" fill="#d4af37"/>
            </svg>

            <div class="actions-grid" style="grid-template-columns: 1fr; gap: 15px;">
                <a href="https://maps.app.goo.gl/QpdQbdnT7zMJ3B7s7" target="_blank" class="action-btn">
                    <i class="fa-solid fa-location-dot main-icon"></i>
                    <div class="btn-text">
                        <span class="title">موقع القاعة</span>
                        <span class="sub-text">افتح الخريطة على جوجل</span>
                    </div>
                </a>

                <div class="action-btn music-player" id="musicPlayer" title="تشغيل / إيقاف الموسيقى">
                    <i class="fa-solid fa-music main-icon" id="musicIcon"></i>
                    <div class="btn-text">
                        <span class="title">الموسيقى</span>
                        <span class="sub-text">ادخلي عمري</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مشغل الصوت - ملف محلي لضمان التشغيل -->
    <audio id="bgAudio" loop preload="auto">
        <source src="ادخلي عمري.m4a" type="audio/mp4">
    </audio>

    <script>
        // Countdown
        const weddingDate = new Date("July 17, 2026 20:00:00").getTime();
        
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById("secs").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            } else {
                document.getElementById("countdown").innerHTML = "<h3 style='color: var(--gold-2); text-shadow: 0 0 10px var(--gold-2); margin: 0;'>اليوم هو يوم الفرح! 🎉</h3>";
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Music Player & Envelope Logic
        const bgAudio = document.getElementById('bgAudio');
        const musicPlayer = document.getElementById('musicPlayer');
        const musicIcon = document.getElementById('musicIcon');
        const envelopeScreen = document.getElementById('envelopeScreen');
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        const invitationCard = document.getElementById('invitationCard');
        
        let isPlaying = false;

        function playAudio() {
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    musicPlayer.classList.add('playing');
                    musicIcon.className = "fa-solid fa-pause main-icon";
                    isPlaying = true;
                }).catch(err => {
                    console.log('Autoplay blocked by browser. Waiting for interaction.');
                });
            }
        }

        // Open envelope interaction
        envelopeWrapper.addEventListener('click', () => {
            // Animate envelope
            envelopeWrapper.classList.add('open');
            
            // Play music immediately upon this user click
            playAudio();

            // Transition screens
            setTimeout(() => {
                envelopeScreen.style.opacity = '0';
                setTimeout(() => {
                    envelopeScreen.style.display = 'none';
                    invitationCard.classList.add('show');
                }, 1500); // Wait for fade out
            }, 800); // Wait for flap to open
        });

        // Manual play/pause button
        musicPlayer.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isPlaying) {
                playAudio();
            } else {
                bgAudio.pause();
                musicPlayer.classList.remove('playing');
                musicIcon.className = "fa-solid fa-music main-icon";
                isPlaying = false;
            }
        });

        // Particles removed
    </script>
</body>
</html>
