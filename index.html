<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سيف & إسراء</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cairo:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --cream:   #FBF8F3;
  --warm:    #F5EFE6;
  --blush:   #EDD9C8;
  --rose:    #C8896A;
  --rose2:   #A86848;
  --gold:    #B8963E;
  --gold2:   #D4AF6A;
  --sage:    #8A9E88;
  --ink:     #2C2218;
  --ink2:    #5C4A38;
  --muted:   #9C8B7A;
  --white:   #FFFFFF;
}

html, body {
  background: var(--cream);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  color: var(--ink);
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* ══════════════════
   LANDING SCREEN
══════════════════ */
.landing {
  position: fixed;
  inset: 0;
  background: var(--cream);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1.3s ease, visibility 1.3s ease;
  overflow: hidden;
}

.landing.out { opacity: 0; visibility: hidden; pointer-events: none; }

.floral-tl, .floral-br {
  position: absolute;
  width: min(55vw, 240px);
  opacity: 0.22;
  pointer-events: none;
}
.floral-tl { top: -20px; right: -20px; transform: rotate(0deg); }
.floral-br { bottom: -20px; left: -20px; transform: rotate(180deg); }

.landing-body {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 clamp(20px, 8vw, 48px);
  gap: 0;
  width: 100%;
}

.land-tag {
  font-size: clamp(9px, 2.5vw, 11px);
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--rose);
  font-weight: 700;
  margin-bottom: clamp(12px, 3vw, 20px);
}

.land-names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(48px, 17vw, 82px);
  color: var(--ink);
  line-height: 1.05;
}

.land-names em {
  color: var(--rose);
  font-style: normal;
}

.land-ornament {
  margin: clamp(12px, 3vw, 20px) 0 clamp(10px, 2.5vw, 16px);
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(200px, 50vw);
}
.land-ornament::before, .land-ornament::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--blush));
}
.land-ornament::after { background: linear-gradient(to left, transparent, var(--blush)); }
.land-ornament-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rose); flex-shrink: 0; }

.land-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(14px, 4vw, 20px);
  color: var(--ink2);
  letter-spacing: 3px;
  font-style: italic;
  margin-bottom: clamp(28px, 6vw, 40px);
}

.land-btn {
  background: var(--rose);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: clamp(12px, 3vw, 16px) clamp(32px, 8vw, 48px);
  font-family: 'Cairo', sans-serif;
  font-size: clamp(13px, 3.5vw, 16px);
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(200, 137, 106, 0.35);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.land-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  opacity: 0;
  transition: opacity 0.3s;
}

.land-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(200,137,106,0.4); }
.land-btn:hover::after { opacity: 1; }
.land-btn:active { transform: translateY(0); }

.land-hint {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ══════════════════
   INVITATION CARD
══════════════════ */
.card {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  background: var(--cream);
  opacity: 0;
  transition: opacity 0.9s ease 0.2s;
  display: flex;
  flex-direction: column;
  will-change: transform, opacity;
  transform: translateZ(0);
}
.card.show { opacity: 1; }

/* ── HERO ── */
.hero {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  /* تم التعديل لدمج لون خلفية الصورة */
  background: #FDFBF9; 
}

.hero::before {
  content: '';
  position: absolute;
  top: 8vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(75vw, 320px);
  height: min(75vw, 320px);
  border-radius: 50%;
  background: rgba(200,137,106,0.06);
  z-index: 1;
}

.hero::after {
  content: '';
  position: absolute;
  top: 6vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(85vw, 360px);
  height: min(85vw, 360px);
  border-radius: 50%;
  border: 1px solid rgba(200,137,106,0.12);
  z-index: 1;
}

.hero-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  /* التعديل لمنع القص والزوم */
  object-fit: contain; 
  object-position: center center;
  z-index: 2;
  transform: translateZ(0);
}

.hero-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(253,251,249,0) 0%,
    rgba(253,251,249,0) 70%,
    rgba(253,251,249,0.3) 85%,
    rgba(253,251,249,1) 100%
  );
  z-index: 3;
}

.hero-fade-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(to bottom, rgba(253,251,249,0.3), transparent);
  z-index: 3;
}

.hero-text {
  position: relative;
  z-index: 4;
  padding: 0 28px 20px;
  text-align: center;
  width: 100%;
}

.hero-tag {
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--rose2);
  font-weight: 700;
  margin-bottom: 6px;
  opacity: 0;
  transform: translateY(14px);
  transition: all 0.7s ease 0.5s;
}

.card.show .hero-tag { opacity: 1; transform: translateY(0); }

.hero-names {
  font-family: 'Great Vibes', cursive;
  font-size: min(14vw, 64px);
  color: var(--ink);
  line-height: 1.1;
  opacity: 0;
  transform: translateY(18px);
  transition: all 0.8s ease 0.7s;
}

.hero-names .amp {
  color: var(--rose);
  font-size: min(16vw, 75px);
}

.card.show .hero-names { opacity: 1; transform: translateY(0); }

.hero-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  color: var(--ink2);
  font-style: italic;
  letter-spacing: 2px;
  margin-top: 4px;
  opacity: 0;
  transition: opacity 0.7s ease 1.1s;
}
.card.show .hero-date { opacity: 1; }

.scroll-arrow {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 18px 0 30px;
  opacity: 0;
  transition: opacity 0.7s ease 1.6s;
  animation: arrowBounce 2s ease-in-out infinite 2s;
  cursor: pointer;
}
.card.show .scroll-arrow { opacity: 0.5; }
@keyframes arrowBounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(7px); }
}
.scroll-arrow i { font-size: 16px; color: var(--rose); }
.scroll-arrow span { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; font-weight: 600; }

/* ── BODY ── */
.body { display: flex; flex-direction: column; align-items: center; }

.ornament {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 85%;
  max-width: 340px;
  margin: 40px 0;
  opacity: 0;
  transform: scaleX(0.7);
  transition: all 0.6s ease;
}

.ornament.visible { opacity: 1; transform: scaleX(1); }

.orn-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--blush) 40%, var(--blush) 60%, transparent);
}

.orn-center { display: flex; align-items: center; gap: 6px; }
.orn-d { width: 5px; height: 5px; border-radius: 50%; background: var(--rose); opacity: 0.5; }
.orn-d.big { width: 7px; height: 7px; opacity: 1; }

.section {
  width: 100%;
  padding: 0 clamp(14px, 5vw, 28px);
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.section.visible { opacity: 1; transform: translateY(0); }

/* ─ Invite text ─ */
.invite-wrap {
  background: var(--white);
  border-radius: 24px;
  padding: clamp(24px, 6vw, 40px) clamp(18px, 5vw, 32px);
  text-align: center;
  box-shadow: 0 4px 30px rgba(140,80,50,0.07);
  border: 1px solid rgba(237,217,200,0.8);
}

.invite-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(28px, 8vw, 42px);
  color: var(--rose);
  margin-bottom: 14px;
}

.invite-text {
  font-size: clamp(13px, 4vw, 17px);
  color: var(--ink2);
  line-height: 2.1;
  font-weight: 300;
}

/* ─ Date card ─ */
.date-card {
  background: var(--white);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 4px 30px rgba(140,80,50,0.07);
  border: 1px solid rgba(237,217,200,0.8);
}

.date-top {
  background: var(--rose);
  padding: clamp(20px, 5vw, 32px) clamp(16px, 4vw, 28px);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.date-top::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}

.date-top::after {
  content: '';
  position: absolute;
  bottom: -60px; left: -30px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
}

.date-day-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(72px, 22vw, 108px);
  font-weight: 600;
  color: #fff;
  line-height: 0.9;
  letter-spacing: -4px;
  position: relative;
  z-index: 1;
}

.date-month-name {
  font-size: clamp(9px, 2.5vw, 12px);
  letter-spacing: 6px;
  color: rgba(255,255,255,0.85);
  text-transform: uppercase;
  font-weight: 700;
  margin-top: 8px;
  position: relative;
  z-index: 1;
}

.date-bottom {
  padding: clamp(16px, 4vw, 26px) clamp(16px, 4vw, 28px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.date-year-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(16px, 4.5vw, 22px);
  color: var(--muted);
  font-style: italic;
  letter-spacing: 2px;
}

.time-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(200,137,106,0.1);
  border: 1.5px solid rgba(200,137,106,0.25);
  border-radius: 50px;
  padding: clamp(8px, 2.5vw, 12px) clamp(18px, 5vw, 28px);
  font-size: clamp(13px, 3.5vw, 16px);
  color: var(--rose2);
  font-weight: 700;
  letter-spacing: 1px;
}

/* ─ Countdown ─ */
.cd-card {
  background: var(--white);
  border-radius: 24px;
  padding: clamp(22px, 5vw, 34px) clamp(12px, 4vw, 22px) clamp(18px, 4vw, 28px);
  box-shadow: 0 4px 30px rgba(140,80,50,0.07);
  border: 1px solid rgba(237,217,200,0.8);
  text-align: center;
}

.cd-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 4vw, 19px);
  font-style: italic;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: clamp(16px, 4vw, 26px);
}

#countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  direction: ltr;
}

.cd-box { text-align: center; position: relative; }

.cd-box:not(:last-child)::after {
  content: ':';
  position: absolute;
  left: 100%;
  top: 6px;
  transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 6vw, 30px);
  color: var(--blush);
  line-height: 1;
  font-weight: 600;
}

.cd-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 11vw, 54px);
  font-weight: 600;
  color: var(--rose);
  line-height: 1;
  display: block;
}

.cd-lbl {
  font-size: clamp(7px, 2vw, 10px);
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 6px;
  display: block;
  font-weight: 600;
}

/* ─ Actions ─ */
.actions { display: flex; flex-direction: column; gap: 14px; }

.act-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--white);
  border: 1.5px solid rgba(237,217,200,0.9);
  border-radius: 18px;
  padding: 18px 20px;
  text-decoration: none;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 2px 16px rgba(140,80,50,0.05);
}

.act-btn:hover, .act-btn:active {
  border-color: var(--rose);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(200,137,106,0.15);
}

.act-ico {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: rgba(200,137,106,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--rose);
  flex-shrink: 0;
  transition: all 0.25s;
}

.act-btn:hover .act-ico { background: var(--rose); color: #fff; }

.act-info { flex: 1; text-align: right; }
.act-name { font-size: 15px; font-weight: 700; }
.act-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

.act-arr { font-size: 12px; color: var(--blush); transition: all 0.2s; }
.act-btn:hover .act-arr { color: var(--rose); transform: translateX(-4px); }

/* Music playing */
.music-act.on { border-color: rgba(200,137,106,0.5); background: rgba(200,137,106,0.04); }
.music-act.on .act-ico { background: var(--rose); color: #fff; }

@keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
.music-act.on .act-ico i { animation: beat 0.9s ease-in-out infinite; }

/* ── FOOTER ── */
.footer {
  padding: 50px 20px 60px;
  text-align: center;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.footer.visible { opacity: 1; transform: translateY(0); }

.footer-mono {
  font-family: 'Great Vibes', cursive;
  font-size: 52px;
  color: var(--rose);
  display: block;
  margin-bottom: 10px;
}

.footer-info {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--muted);
  font-weight: 300;
}

.footer-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
}
.footer-dots span {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--blush);
}
.footer-dots span:nth-child(2) { background: var(--rose); }

/* ══════════════════
   DESKTOP RESPONSIVENESS
══════════════════ */
@media (min-width: 768px) {
  body {
    background: linear-gradient(135deg, var(--warm) 0%, var(--blush) 100%);
    padding: 40px 0;
    align-items: center; 
  }
  
  .card {
    border-radius: 32px; 
    box-shadow: 0 25px 60px rgba(140,80,50,0.15); 
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.5);
    min-height: auto; 
  }

  .hero {
     min-height: 80vh; 
  }
}
</style>
</head>

  <div class="landing-body">

    </div>

</div>

<div class="card" id="card">
  <div class="hero">
    <img class="hero-photo" src="couple.jpg" alt="سيف وإسراء" onerror="this.style.display='none'">
    <div class="hero-fade-top"></div>
    <div class="hero-fade"></div>

    <div class="hero-text">
      <div class="hero-tag">Wedding Invitation</div>
      <h1 class="hero-names">Seif <span class="amp">♥</span> Esraa</h1>
      <div class="hero-date">يوم الجمعة، ١٧ يوليو ٢٠٢٦</div>
    </div>

    <div class="scroll-arrow" onclick="scrollToSection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--rose)"><polyline points="6 9 12 15 18 9"/></svg>

    </div>
  </div>
